<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="icon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="12" fill="url(#bg-grad)" />

  <!-- Subtle background circuit pattern -->
  <path fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" d="M 40,80 H 360 M 80,40 V 360 M 320,40 V 360 M 40,320 H 360" opacity="0.4" />

  <!-- Circuit Chip Icon -->
  <g transform="translate(136, 110)">
    <!-- Outer Chip Box -->
    <rect x="14" y="14" width="100" height="100" rx="16" fill="none" stroke="url(#icon-grad)" stroke-width="4" />
    <!-- Inner Core -->
    <rect x="36" y="36" width="56" height="56" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <!-- Center Spark Dot -->
    <circle cx="64" cy="64" r="8" fill="url(#icon-grad)" />
    
    <!-- Chip Pins - Top/Bottom -->
    <line x1="38" y1="2" x2="38" y2="14" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <line x1="64" y1="2" x2="64" y2="14" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <line x1="90" y1="2" x2="90" y2="14" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <line x1="38" y1="114" x2="38" y2="126" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <line x1="64" y1="114" x2="64" y2="126" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <line x1="90" y1="114" x2="90" y2="126" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />

    <!-- Chip Pins - Left/Right -->
    <line x1="2" y1="38" x2="14" y2="38" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <line x1="2" y1="64" x2="14" y2="64" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <line x1="2" y1="90" x2="14" y2="90" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <line x1="114" y1="38" x2="126" y2="38" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <line x1="114" y1="64" x2="126" y2="64" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <line x1="114" y1="90" x2="126" y2="90" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Text Section -->
  <text x="200" y="275" text-anchor="middle" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="20" letter-spacing="3">SPARK LAB</text>
  <text x="200" y="305" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="14">Product Image Coming Soon</text>
</svg>
